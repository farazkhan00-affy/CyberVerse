<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#00B0FF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Shield outline -->
  <path
    d="M100 15 L165 40 L165 95 C165 140 138 172 100 188 C62 172 35 140 35 95 L35 40 Z"
    fill="#0A0A0A"
    stroke="url(#shieldGrad)"
    stroke-width="4"
    filter="url(#glow)"
  />

  <!-- Inner circuit lines -->
  <g stroke="url(#shieldGrad)" stroke-width="1.5" opacity="0.5" fill="none">
    <path d="M55 60 L75 60 L75 75" />
    <path d="M145 60 L125 60 L125 75" />
    <path d="M55 130 L75 130 L75 115" />
    <path d="M145 130 L125 130 L125 115" />
    <circle cx="55" cy="60" r="2.5" fill="url(#shieldGrad)" stroke="none"/>
    <circle cx="145" cy="60" r="2.5" fill="url(#shieldGrad)" stroke="none"/>
    <circle cx="55" cy="130" r="2.5" fill="url(#shieldGrad)" stroke="none"/>
    <circle cx="145" cy="130" r="2.5" fill="url(#shieldGrad)" stroke="none"/>
  </g>

  <!-- Lock body -->
  <rect x="78" y="98" width="44" height="36" rx="6" fill="url(#shieldGrad)"/>
  <!-- Lock shackle -->
  <path
    d="M86 98 L86 82 C86 71 92 64 100 64 C108 64 114 71 114 82 L114 98"
    stroke="url(#shieldGrad)"
    stroke-width="7"
    fill="none"
    stroke-linecap="round"
  />
  <!-- Keyhole -->
  <circle cx="100" cy="112" r="5" fill="#0A0A0A"/>
  <rect x="97.5" y="114" width="5" height="10" fill="#0A0A0A"/>
</svg>
